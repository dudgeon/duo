<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Today's notes — open</title>

  <!--
    button-card.html — Stage 27 reference template (1 of 5).

    What it demonstrates: a single-card layout with a CTA button that
    drives an `editor:open` action verb. The card pattern works for
    "open this file" launchers, "view that doc" cards on a dashboard,
    or any one-shot click-to-open affordance.

    Why this template: tutorials and lesson packs often need a "click
    here to start" entry point. The card is large enough to be
    obvious, the button drops the file into the right surface.

    Customize:
      - data-path on the button → the file you want to open
      - data-mode on the button → editor | canvas | browser
        (omit to honor the file's <meta name="duo-open-in"> hint)
      - h2 / p / button label → user-facing copy

    Trust gate: this canvas must live under ~/.claude/duo/ for the
    action to fire. See skill/canvas-authoring.md § "The contract".
  -->

  <!-- Mount read-only by default; user can flip to edit via toolbar. -->
  <meta name="duo-default-editable" content="false">

  <style>
    :root {
      --paper: #FBF8EE;
      --paper-deep: #F0E9D6;
      --ink: #1A1410;
      --ink-soft: #3D352A;
      --ink-mute: #7B6F58;
      --accent: #C66A2E;
      --accent-soft: #F2D9B8;
      --accent-ink: #7A3E1A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1A1611;
        --paper-deep: #13100C;
        --ink: #F0E9D6;
        --ink-soft: #C8BFA3;
        --ink-mute: #8A7E60;
      }
    }
    body {
      margin: 0;
      padding: 48px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      line-height: 1.5;
    }
    .card {
      max-width: 560px;
      margin: 0 auto;
      padding: 32px;
      border: 1px solid var(--paper-deep);
      border-radius: 8px;
      background: var(--paper-deep);
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 20px;
      color: var(--ink);
    }
    .card p {
      margin: 0 0 24px;
      color: var(--ink-soft);
      font-size: 14px;
    }
    .cta {
      background: var(--accent);
      color: white;
      border: 0;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .cta:hover { background: var(--accent-ink); }
    .meta { color: var(--ink-mute); font-size: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <main class="card" data-duo-id="card-todays-notes">
    <h2>Today's notes</h2>
    <p>Open <code>~/notes/today.md</code> in the markdown editor to capture
    something quick.</p>
    <button class="cta"
            data-duo-action="editor:open"
            data-path="~/notes/today.md"
            data-duo-id="card-todays-notes-cta">
      Open notes
    </button>
    <div class="meta">Edit <code>data-path</code> above to point at any markdown
    file under <code>~/</code>.</div>
  </main>
</body>
</html>

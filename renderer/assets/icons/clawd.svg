<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  ENH-044 — clawd glyph used by the new-Claude split-button affordance
  in the terminal tab strip. Source: Inkscape canvas authored by Geoff
  (2026-05-02). Cropped from the original 210mm × 297mm A4 canvas to
  the creature's actual bounding box so it renders at button size
  without empty padding. Original color: c15f3c (Atelier accent
  family) — preserved as the visual identity. The glyph is the
  authoritative visual cue for "open a new Claude tab" anywhere in
  the renderer; if it gets reused (titlebar, status pill, etc.), it
  should always carry that semantic.
-->
